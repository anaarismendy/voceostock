[project]
name = "voceostock-backend"
version = "0.1.0"
description = "VoceoStock API — captura de inventario por voz"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
markers = ["integration: pruebas contra servicios reales (CI las salta)"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
