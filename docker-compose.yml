services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voceo
      POSTGRES_PASSWORD: voceo
      POSTGRES_DB: voceostock
    ports:
      # ponytail: 5433/8010 en el host porque otro proyecto local ocupa 5432/8000
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    ports:
      - "8010:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://voceo:voceo@db:5432/voceostock
    volumes:
      - ./backend/app:/app/app
      - ./storage:/app/storage
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_PROXY: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

volumes:
  pgdata:
